name: Frontend CI/CD Pipeline

on:
  push:
    branches:
      - main
      - dev
      - "feature/**"
  pull_request:
    branches:
      - main
      - dev

jobs:
  # 1. TAHAP LINT
  lint:
    name: Lint & Code Style
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

  # 2. TAHAP TEST (Menunggu job lint selesai)
  test:
    name: Unit Testing (Vitest)
    needs: lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run Vitest unit tests (Tanpa backend Laravel)
        run: npm test

  # 3. TAHAP BUILD (Menunggu job test selesai)
  build:
    name: Build Frontend
    needs: test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build Vue application
        run: npm run build

      - name: Upload build artifact (dist)
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 1

  # 4. TAHAP DEPLOY (Menunggu job build selesai, HANYA di branch main, skip di PR)
  deploy:
    name: Deploy Frontend
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: dist

      - name: Display dist contents (Hasil build dioper via artifact)
        run: |
          echo "📦 Menampilkan isi direktori dist/ yang dioper dari job build:"
          ls -la dist/

      - name: Deploy Simulation
        run: |
          echo "🚀 Memulai deployment frontend ke server hosting/CDN..."
          echo "✅ Deployment frontend ke production berhasil diselesaikan tanpa build ulang!"
